<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust - Travel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .hero {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
                url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80");
            background-size: cover;
            background-position: center;
            color: white;
        }

        nav {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #ffd166;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #ffd166;
        }

        .hero-content {
            min-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 7%;
            max-width: 700px;
        }

        .hero-content h1 {
            font-size: 65px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 19px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            width: fit-content;
            padding: 14px 30px;
            background: #ffd166;
            color: #222;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: white;
        }

        @media (max-width: 768px) {
            nav ul {
                gap: 15px;
            }

            nav ul li a {
                font-size: 14px;
            }

            .hero-content h1 {
                font-size: 45px;
            }

            .hero-content {
                padding: 0 7%;
            }
        }
    </style>
</head>

<body>

    <section class="hero">

        <nav>
            <div class="logo">Wander<span>lust</span></div>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="places.html">Places</a></li>
                <li><a href="packages.html">Packages</a></li>
                <li><a href="gallery.html">Gallery</a></li>
            </ul>
        </nav>

        <div class="hero-content">
            <h1>Explore The World</h1>

            <p>
                Discover beautiful destinations, unforgettable adventures
                and amazing experiences around the world.
            </p>

            <a href="places.html" class="btn">Explore Now</a>
        </div>

    </section>

</body>
</html>
